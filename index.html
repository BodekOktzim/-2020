<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Facebook Search Bot</title>

<style>

body{
    font-family:Arial;
    background:#f0f2f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    background:#1877f2;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.result{
    margin-top:20px;
    background:#f5f5f5;
    padding:15px;
    white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="container">

<h2>Facebook Search Bot</h2>

<input
id="searchInput"
placeholder="Phone / UID"
/>

<button onclick="searchData()">
Search
</button>

<div
id="result"
class="result">
</div>

</div>

<script>

async function searchData(){

    const value =
    document.getElementById('searchInput').value;

    const result =
    document.getElementById('result');

    result.innerText = 'Searching...';

    try{

        const response =
        await fetch(`https://2020.onrender.com/search?value=${encodeURIComponent(value)}`);

        const data =
        await response.json();

        if(!data.success){

            result.innerText =
            'Error: ' + (data.error || data.message);

            return;
        }

        if(data.results.length === 0){

            result.innerText =
            'No results found';

            return;
        }

        result.innerText =
        JSON.stringify(data.results,null,2);

    }catch(err){

        result.innerText =
        'Server error';
    }
}

</script>

</body>

</html>
